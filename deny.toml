# Lieferkettenprüfung (Playbook 06), läuft in CI über cargo-deny.

[advisories]
# Bekannte Sicherheitslücken und nicht mehr gepflegte Crates blockieren.
unmaintained = "all"
yanked = "deny"

[licenses]
# Eigene Crates (GPL-3.0-or-later, ADR 0003) sind nicht veröffentlicht.
# Erlaubt sind nur GPL-3.0-verträgliche Lizenzen.
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Pfad-Abhängigkeiten innerhalb des Workspace sind keine Wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
