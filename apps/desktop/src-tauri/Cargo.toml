[package]
name = "lepaca-desktop"
description = "Oberfläche von lepaca (Tauri 2, ADR 0002)."
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

# Eigener Workspace: Die Oberfläche braucht WebKitGTK & Co. zum Bauen, der
# Kern soll ohne diese Systembibliotheken testbar bleiben.
[workspace]

[lib]
name = "lepaca_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
lepaca-core = { path = "../../../crates/lepaca-core" }
lepaca-io = { path = "../../../crates/lepaca-io" }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
