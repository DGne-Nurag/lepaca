name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  lieferkette:
    name: Lieferkette (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  desktop:
    name: Desktop-App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            datei: lepaca-desktop
          - name: windows-x86_64
            os: windows-latest
            datei: lepaca-desktop.exe
          - name: macos-arm64
            os: macos-latest
            datei: lepaca-desktop
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Systembibliotheken (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev
      - name: npm-Pakete (exakt nach package-lock.json, ohne Install-Skripte)
        run: npm ci --ignore-scripts
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: Oberfläche prüfen und bauen
        run: npm run build
      - name: Formatierung
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      # Über die Tauri-CLI, damit die gebaute Oberfläche eingebettet wird.
      - name: App bauen
        run: npx --no-install tauri build --no-bundle -- --locked
      # Nur zum Testen: unsigniert, kein Installer, kein Release (Playbook 06).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lepaca-desktop-${{ matrix.name }}
          path: apps/desktop/src-tauri/target/release/${{ matrix.datei }}
          retention-days: 14
          if-no-files-found: error

  desktop-lieferkette:
    name: Desktop-App Lieferkette (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Nimmt apps/desktop/src-tauri/deny.toml neben dem Manifest.
          manifest-path: apps/desktop/src-tauri/Cargo.toml
