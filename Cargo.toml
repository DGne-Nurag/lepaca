[workspace]
resolver = "3"
members = ["crates/lepaca-core", "crates/lepaca-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "deny"
unwrap_used = "warn"
